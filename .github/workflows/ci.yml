name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly on main: keeps the toolchain cache below alive (GitHub drops a cache unused for
  # 7 days, and releases can be further apart) and notices a changed runner image early.
  schedule:
    - cron: "17 4 * * 1"

# Read-only by default; only the tag-only release job may write (the release itself).
permissions:
  contents: read

# A newer push to a branch or PR supersedes a running check; tag runs (releases) always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # PY32F0 SDK (CMSIS + LL drivers) used straight from py32f0-template, pinned.
  SDK_REPO: https://github.com/IOsetting/py32f0-template
  SDK_COMMIT: 009bdec7ed77c9b782a258c064c227e15ec19498

jobs:
  # A push to main that a release tag points at (release.sh pushes both at once) is built and
  # tested by the tag's run: the branch run skips its jobs.
  gate:
    name: Release tag on this commit?
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          skip=false
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] &&
             git ls-remote --tags "$REPO" 'refs/tags/v*' | grep -q "^$SHA[[:space:]]"; then
            skip=true
            echo "::notice::a release tag points at $SHA: its own run builds and tests it"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  test:
    name: Host unit tests
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # make test includes make test-boot, the bootloader harness (docs/BOOTLOADER.md section 11):
      # plain cc, no ARM toolchain and no zlib; Linux >= 4.17 for MAP_FIXED_NOREPLACE (24.04 has it).
      - name: Bootloader harness, dimming, input and gesture logic, settings store, flash driver, protocol, UART, health, image tools (PC build)
        run: make test

  build:
    name: Firmware builds
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The ARM toolchain comes from Ubuntu's packages (the compiler the released images were
      # built with), without the C++ library apt recommends (463 MB, the C build never links it):
      # ~110 MB. Its .deb files are cached under a key made of their exact versions, so only the
      # package index comes from a mirror, and a new package version makes a new cache. apt runs
      # through tools/ci/apt.sh: Azure's Ubuntu mirror first (the runner's EC2 region mirror
      # stalled the download several times, one release failed on it), a time limit per call and
      # one retry on the main archive.
      - name: Toolchain packages (versions)
        id: tc
        timeout-minutes: 5
        run: |
          tools/ci/apt.sh --mirrors
          tools/ci/apt.sh update -q
          debs=$(sudo apt-get install --print-uris -qq --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi \
                 | cut -d"'" -f2 | xargs -r -n1 basename | sort)
          [ -n "$debs" ] || { echo "::error::no toolchain packages to install"; exit 1; }
          echo "$debs"
          echo "key=arm-toolchain-$(lsb_release -rs)-$(echo "$debs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Toolchain cache
        id: tc-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-arm/*.deb
          key: ${{ steps.tc.outputs.key }}

      - name: Toolchain
        timeout-minutes: 8
        run: |
          mkdir -p ~/apt-arm/partial
          # Sandbox user root: apt's _apt user cannot reach the runner's home, so apt downloads as root
          # anyway, only with a warning.
          o=(-o Dir::Cache::Archives="$HOME/apt-arm" -o APT::Keep-Downloaded-Packages=true
             -o APT::Sandbox::User=root --no-install-recommends)
          echo "to download: $(sudo apt-get install --print-uris -qq "${o[@]}" gcc-arm-none-eabi libnewlib-arm-none-eabi | wc -l) package(s)"
          tools/ci/apt.sh install -y -q "${o[@]}" gcc-arm-none-eabi libnewlib-arm-none-eabi
          # apt leaves its lock and partial/ root-only: the cache keeps the .deb files alone
          sudo chown -R "$(id -u):$(id -g)" ~/apt-arm
          ls ~/apt-arm/*.deb | wc -l | sed 's/^/cached .deb files: /'
          arm-none-eabi-gcc --version | head -1

      - name: Toolchain cache (save)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-arm/*.deb
          key: ${{ steps.tc.outputs.key }}

      - name: PY32 SDK
        run: |
          git clone -q "$SDK_REPO" sdk
          git -C sdk checkout -q "$SDK_COMMIT"

      - name: Curve tables match their generator
        run: |
          python3 tools/gen_curves.py > "$RUNNER_TEMP/curves.h"
          diff -u src/curves.h "$RUNNER_TEMP/curves.h"

      - name: Build normal, diagnostics, measurement and bench builds
        run: |
          set -e
          for v in "" DIAG=1 MEASURE=1 SIM=1; do
            echo "::group::make $v"
            make SDK="$PWD/sdk/Libraries" $v
            echo "::endgroup::"
          done

      - name: Bootloader layout (boot_id at 0x08000010, write range, size, RAM)
        run: make SDK="$PWD/sdk/Libraries" check-boot

      - name: Image headers (CONFIRMS and the bench flag, the build) and the watchdog first in main()
        # docs/BOOTLOADER.md section 9 items 1 and 2: checked on the images and ELFs themselves.
        run: |
          python3 tools/check_app.py build normal
          python3 tools/check_app.py build-diag diag
          python3 tools/check_app.py build-measure measure
          python3 tools/check_app.py build-sim sim

      - name: Size report (a warning, not a failure, when a build has little room left)
        env:
          # Below this many free bytes a build gets a warning: room for the next fix is short.
          HEADROOM_WARN_BYTES: 512
        run: |
          # The app's room: 12 KB, or 14 KB with RING_HIGH (settings ring at 0x08004800)
          room() { python3 -c "import sys; d = open(sys.argv[1], 'rb').read(); print(14336 if d[0xCD] & 0x10 else 12288)" "$1"; }
          {
            echo "| build | app bytes | free of |"
            echo "|---|---|---|"
            for d in build build-diag build-measure build-sim; do
              n=$(stat -c %s "$d/zdms16_py32.img")
              r=$(room "$d/zdms16_py32.img")
              echo "| $d | $n | $((r - n)) of $r |"
            done
            echo
            echo "bootloader: $(stat -c %s build-boot/boot.bin) of 4096 bytes"
            python3 tools/fwimage.py notes build-boot/boot.bin build/zdms16_py32_full.bin
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for d in build build-diag build-measure build-sim; do
            r=$(room "$d/zdms16_py32.img")
            free=$((r - $(stat -c %s "$d/zdms16_py32.img")))
            if [ "$free" -lt "$HEADROOM_WARN_BYTES" ]; then
              echo "::warning title=Flash headroom::$d has only $free of $r bytes free (warning below $HEADROOM_WARN_BYTES)"
            fi
          done
          free=$((4096 - $(stat -c %s build-boot/boot.bin)))
          if [ "$free" -lt "$HEADROOM_WARN_BYTES" ]; then
            echo "::warning title=Flash headroom::the bootloader has only $free of 4096 bytes free (warning below $HEADROOM_WARN_BYTES)"
          fi

      - name: Bootloader and app ELF checks (boot_id, flash write guard, RAM, ring layout)
        run: |
          set -e
          # k_boot_id at 0x08000010 (16 bytes); _flash_write_start/_end = 0x08001000/0x08004800;
          # boot.bin <= 4096 (warning above 3584); _ebss + 512 bytes of stack <= 0x20000BE0
          python3 tools/check_elf.py boot build-boot/boot.elf build-boot/boot.bin
          # RING_HIGH exactly when _settings_start is 0x08004800, in every build
          for d in build build-diag build-measure build-sim; do
            python3 tools/check_elf.py app "$d/zdms16_py32.elf" "$d/zdms16_py32.img"
          done

      - name: The app's own memset/memcpy/memmove/memcmp (src/libc_min.c) call nothing
        run: |
          # A loop turned back into a library call would make them call themselves.
          for d in build build-diag build-measure build-sim; do
            if grep -qE 'libc_a-mem(set|cpy-stub|move|cmp)\.o' "$d/zdms16_py32.map"; then
              echo "::error::$d links newlib's mem* functions, not src/libc_min.c"
              exit 1
            fi
            for f in memset memcpy memmove memcmp; do
              if arm-none-eabi-objdump -d --disassemble="$f" "$d/zdms16_py32.elf" | grep -qE $'\tblx?\t'; then
                echo "::error::$f in $d calls another function"
                exit 1
              fi
            done
          done

      - name: Images for the module (ZTU embedding) refuse bench, measurement and diagnostics builds
        run: |
          mkdir -p dist
          python3 tools/embed_ztu.py build/zdms16_py32.img dist/secondary_mcu_image.c
          refused() {  # image, the refusal embed_ztu.py must give for it
            local out
            if out=$(python3 tools/embed_ztu.py "$1" "$RUNNER_TEMP/refused.c" 2>&1); then
              echo "::error::embed_ztu.py accepted $1"
              exit 1
            fi
            if ! grep -qF "$2" <<< "$out"; then
              echo "::error::embed_ztu.py refused $1, but not with '$2': $out"
              exit 1
            fi
            echo "refused as expected: $1: $out"
          }
          refused build-sim/zdms16_py32.img "refusing a SIM bench build"
          refused build-measure/zdms16_py32.img "refusing a measurement build"
          refused build-diag/zdms16_py32.img "refusing a diagnostics build"

      - name: Release files (flat, named as attached to a release, so sha256sum -c works on a download)
        run: |
          cp build/zdms16_py32.img build/zdms16_py32_full.bin build-boot/boot.bin dist/
          cd dist
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: zdms16-py32-${{ github.sha }}
          path: |
            build/zdms16_py32.img
            build/zdms16_py32_full.bin
            build/zdms16_py32.elf
            build-boot/boot.bin
            build-diag/zdms16_py32_full.bin
            build-measure/zdms16_py32_full.bin

      - uses: actions/upload-artifact@v7
        with:
          name: zdms16-py32-release-files-${{ github.sha }}
          path: dist/

  release:
    name: Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: py32-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            tools/changelog.py
            tools/fwimage.py
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: zdms16-py32-release-files-${{ github.sha }}
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cd dist
          sha256sum -c SHA256SUMS
          # The tag must name the version the image carries (FW_VERSION in src/tuya.h).
          ver=$(python3 -c "d=open('zdms16_py32.img','rb').read(); v=d[0xCC]; print(f'v{v>>6}.{(v>>4)&3}.{v&15}')")
          [ "$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but the image is $ver"; exit 1; }
          # Release notes: the short summary of this version from CHANGELOG.md (required), then
          # GitHub's list of commits.
          python3 ../tools/changelog.py "$GITHUB_REF_NAME" ../CHANGELOG.md > ../notes.md || {
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          # A release carries a release build (a multiple of 100 from 300 on; tools/release/release.sh
          # checks it against the previous release before tagging).
          build=$(python3 -c "import struct; print(struct.unpack_from('<H', open('zdms16_py32.img','rb').read(), 0xCE)[0])")
          [ "$build" -ge 300 ] && [ "$build" -le 65533 ] && [ $((build % 100)) = 0 ] || {
            echo "::error::the image's build $build is not a release build"; exit 1; }
          # The bootloader every module installed from this release keeps for good: its size and
          # the boot sector CRC (DP 136), also checked against the full image.
          { echo; echo "Build $build."; python3 ../tools/fwimage.py notes boot.bin zdms16_py32_full.bin; } >> ../notes.md || {
            echo "::error::the bootloader line of the release notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file ../notes.md --generate-notes \
              --title "$GITHUB_REF_NAME" *

  # Optional: a failure here (expired token) shows on the job but does not fail the run, and
  # release.sh (which knows this job by its name starting with "Hand over") then starts
  # py32-bump itself.
  handover:
    name: Hand over to the Zigbee firmware at once (tags v*, optional secret ZTU_DISPATCH_TOKEN)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Start py32-bump in patapovich/tuya-zigbee-switch
        env:
          # Fine-grained PAT for patapovich/tuya-zigbee-switch with Actions: read and write only
          # (it can start workflows there, not push to branches).
          GH_TOKEN: ${{ secrets.ZTU_DISPATCH_TOKEN }}
          ZTU: patapovich/tuya-zigbee-switch
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no ZTU_DISPATCH_TOKEN: $ZTU picks $GITHUB_REF_NAME up at its next hourly check (best effort), or run tools/release/release.sh"
            exit 0
          fi
          failed() {
            echo "::error::hand-over failed ($1): ZTU_DISPATCH_TOKEN expired or without Actions write on $ZTU? The release stands; run tools/release/release.sh, or $ZTU picks $GITHUB_REF_NAME up at its next hourly check (best effort)"
            exit 1
          }
          # GitHub disables scheduled workflows after 60 days without repository activity
          state=$(gh api "repos/$ZTU/actions/workflows/py32-bump.yml" --jq .state) || failed "reading py32-bump"
          if [ "$state" = disabled_inactivity ]; then
            gh api -X PUT "repos/$ZTU/actions/workflows/py32-bump.yml/enable" || failed "enabling py32-bump"
          fi
          gh workflow run py32-bump.yml --repo "$ZTU" -f py32_tag="$GITHUB_REF_NAME" || failed "starting py32-bump"
